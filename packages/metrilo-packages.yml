method: searched
source: https://github.com/Metrilo
registries_checked: [packagist, npm, pypi, rubygems, wordpress.org, github]
note: >-
  Metrilo ships NO language SDK. Its first-party client libraries are ecommerce
  platform integration plugins (WooCommerce, Magento 1 & 2, OpenCart) plus a
  debug Chrome extension, all published in the Metrilo GitHub organization.
  Exactly one is distributed through a real package registry — the Magento 2
  extension on Packagist. npm, PyPI and RubyGems carry no Metrilo package, and
  the WooCommerce plugin is NOT listed on wordpress.org (api.wordpress.org
  returns "Plugin not found"), so it can only be installed from GitHub.
currency_finding: >-
  Every first-party package predates the current API contract's maintenance
  window and most predate it by years. The API's own specification last changed
  2021-06-23; the newest first-party package release is the Magento 2 extension
  2.1.0 on 2023-10-13, and the next-newest is from 2021. The OpenCart plugin
  (2015) and the Chrome debug extension (2016) have had no commit in a decade.
  Metrilo was acquired by Brevo in 2021 and the client-library estate has been
  in maintenance-only mode since.
