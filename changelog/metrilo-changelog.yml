note: >-
  Metrilo publishes NO prose changelog, release-notes page or dated "what's new"
  feed. It does, however, maintain a versioned API registry on SwaggerHub under
  its own org (metrilo/api) with four dated revisions, and the SwaggerHub
  registry API answers unauthenticated. The entries below are therefore
  MEASURED — each version's spec was fetched and diffed against its
  predecessor — not transcribed from a provider-written changelog. Dates are
  SwaggerHub X-Created/X-Modified.
