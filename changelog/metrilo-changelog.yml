  last_change: '2021-06-23'
  days_since_last_change_at_check: 1877
  note: >-
    The API contract has not changed in five years. Metrilo was acquired by
    Brevo (formerly Sendinblue) in 2021 and the final spec revision lands three
    weeks before the last commit to the developer guide (2021-06-23). The
    product is still sold and the endpoint still answers, but the contract is
    frozen.
entries:
  - version: 2.1.1
    date: '2021-06-23'
    breaking: true
    additions:
      - Added POST /customer/tag — add CRM tags to an existing customer.
      - Added POST /customer/untag — remove CRM tags from a customer.
      - 'Added 4 schemas: customerTagObject, customerTagOperationObject, customerUntagObject, customerUntagOperationObject (15 -> 19).'
    changes:
      - >-
        BREAKING — servers[] changed from https://track.metrilo.com/v2 to
        https://trk.mtrl.me, dropping the /v2 path segment. The /v2 prefix is
        still required in practice; every published curl example uses
        https://trk.mtrl.me/v2/<resource>. The spec's servers[] is wrong.
      - >-
        REGRESSION — the X-Digest header parameter, declared on operations in
        2.0.0 and 2.0.1, was removed from the specification. The header is still
        mandatory on every backend endpoint except POST /customer, so from 2.1.1
        onward the HMAC requirement exists only in prose. This is why the
        current spec declares no securitySchemes at all.
    highlights: Customer tagging reaches the API; the spec's own auth and base-URL fidelity regresses.
  - version: 2.0.1
    date: '2021-06-02'
    breaking: false
    additions: []
    changes:
      - >-
        Added a real production server to servers[] — https://track.metrilo.com/v2 —
        alongside the SwaggerHub mock. That hostname NO LONGER RESOLVES (probed
        2026-08-13, DNS failure); it was superseded by trk.mtrl.me three weeks later.
    highlights: First revision to name a callable host rather than only the SwaggerHub virtual server.
  - version: 2.0.0
    date: '2020-08-03'
    breaking: true
    additions:
      - Declared the X-Digest header parameter on operations — "HMAC signature of the request body and the project API secret".
    changes:
      - Request signing becomes part of the published contract.
    highlights: HMAC-SHA256 request signing enters the specification.
  - version: 1.0.0
    date: '2020-05-22'
    modified: '2020-05-27'
    breaking: false
    additions:
      - 'Initial published contract: 8 operations across /category, /customer, /product, /order and their /batch variants; 15 schemas.'
    changes:
      - servers[] pointed only at the SwaggerHub virtual mock (virtserver.swaggerhub.com/metrilo/api/1.0.0) — no production host was published.
    highlights: First OpenAPI 3.0.1 revision of the Metrilo tracking API.
gaps:
  - >-
    No 2.1.0 exists in the registry — the sequence jumps 2.0.1 -> 2.1.1. The
    Magento 2 plugin carries a 2.1.0 tag (2023-10-13); the numbering spaces are
    unrelated.
  - >-
    The developer guide links a v1 migration document at api_v1.md
    ("If you have integrated with the previous version of our API, the guide
    has been moved here") — that file returns 404. The v1 guide is gone.
