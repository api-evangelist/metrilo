    API — OpenAPI 3.0.1, version 2.1.1, 10 operations and 19 schemas covering
    categories, products, customers (including tag/untag) and orders, single
    and batch. Maintained by Metrilo on its SwaggerHub organization and
    mirrored byte-identically as metrilo_open_api_specification.yml in the
    custom-integration repo. This is the authoritative contract; the four
    per-resource entries above are the API Evangelist refinement of the same
