aid: metrilo
name: Metrilo
description: >-
  Metrilo is a plug-and-play ecommerce growth platform that combines real-time
  analytics, an ecommerce CRM, and email marketing for online brands. Founded in
  2014 and acquired by Brevo (formerly Sendinblue) in 2021, Metrilo tracks
  visitor and customer behavior, builds rich customer profiles with 30+
  segmentation filters, and powers retention-focused email campaigns. Developers
  integrate via official plugins for WooCommerce, Magento, and OpenCart, a
  client-side JavaScript tracking library (window.metrilo), and a server-side
  ingestion API at trk.mtrl.me/v2 that pushes customers, categories, products,
  and orders using an API Token plus an HMAC-SHA256 X-Digest request signature.
