  released: '2021-06-23'
  base: https://trk.mtrl.me/v2
  registry: https://app.swaggerhub.com/apis/metrilo/api/2.1.1
  note: >-
    Two version axes. The callable path carries a major version (/v2); the
    specification carries a semver revision (2.1.1) published to Metrilo's own
    SwaggerHub org. Four revisions exist: 1.0.0 (2020-05-22), 2.0.0
    (2020-08-03), 2.0.1 (2021-06-02), 2.1.1 (2021-06-23). No 2.1.0 was ever
    published. Full diffs in changelog/metrilo-changelog.yml.
  spec_servers_defect: >-
    The current specification declares servers[] as https://trk.mtrl.me with no
    /v2 segment, contradicting every published example and the real base URL.
    Corrected in overlays/metrilo-tracking-api-overlay.yaml, not by editing the
    verbatim spec.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No published deprecation policy and no RFC 8594 Sunset/Deprecation header
    support. Metrilo has nevertheless retired things without one, which is
    exactly what a policy would have covered:
  observed_retirements:
    - what: API v1
      evidence: >-
        The developer guide still says "If you have integrated with the previous
        version of our API, the guide has been moved here" and links api_v1.md —
        that file returns 404. The v1 migration guide has been deleted while the
        link that promises it remains live.
      checked_status: 404
    - what: 'Legacy ingestion host: track.metrilo.com'
      evidence: >-
        Published as the production server in specification 2.0.1 (2021-06-02),
        replaced by trk.mtrl.me in 2.1.1 three weeks later. track.metrilo.com no
        longer resolves in DNS (probed 2026-08-13). No sunset notice was issued
        and the retired host is still readable in the 2.0.1 spec SwaggerHub
        continues to serve.
      checked_status: 0
