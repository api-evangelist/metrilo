support:
  channels: [live chat, email]
  help_center: https://docs.metrilo.com
  note: Support is the in-app Intercom chat plus email; there is no developer support channel or forum.
maturity:
  api_last_changed: '2021-06-23'
  docs_last_changed: '2021-06-23'
  newest_first_party_package: '2023-10-13'
  assessment: >-
    Frozen but live. The contract has not moved in five years, the developer
    guide's last commit is the same day as the final spec revision, and the
    only client library released since is the Magento 2 extension in 2023.
    The endpoint itself is healthy — an unauthenticated POST to
    https://trk.mtrl.me/v2/customer returns 401, so the service is running and
    enforcing auth. Metrilo is still sold at published prices (see
    plans/metrilo-plans-pricing.yml). Read this as a maintained,
    feature-complete integration surface, not an abandoned one — but do not
    expect new capability.
