        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /product/batch:
    post:
      tags: [Products]
      operationId: batchProducts
      summary: Bulk import products
      security: [{ xDigest: [] }]
      requestBody:
        required: true
