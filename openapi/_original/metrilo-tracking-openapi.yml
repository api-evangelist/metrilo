      operationId: batchOrders
      summary: Bulk import orders
      security: [{ xDigest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderBatchEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    xDigest:
      type: apiKey
      in: header
      name: X-Digest
      description: >-
        HMAC-SHA256 digest of the raw JSON request body, keyed with the
        project's API Secret. Required for every backend endpoint except
        POST /customer.
  responses:
    Ok:
      description: Request accepted for processing.
    BadRequest:
      description: Bad request (malformed payload).
    Unauthorized:
      description: Invalid API token, or the X-Digest header is missing.
    PaymentRequired:
      description: Payment required for the project.
    Forbidden:
      description: IP is on the ignore list, or the X-Digest signature is invalid.
    ServerError:
      description: Server error while processing the request.
    BadGateway:
      description: Server error while accepting the request.
  schemas:
    Envelope:
      type: object
      required: [token, params]
      properties:
        time:
          type: integer
          format: int64
          description: Client event time in epoch milliseconds.
        token:
          type: string
          description: Project API Token (Settings -> Installation).
        params:
          type: object
    Customer:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        createdAt: { type: integer, format: int64, description: Epoch ms }
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        subscribed: { type: boolean }
        tags:
          type: array
          items: { type: string }
          description: Merged with existing tags, not overwritten.
    Category:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
    Product:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        url: { type: string, format: uri }
        categories:
          type: array
          items: { type: string }
          description: Array of category IDs.
    OrderLine:
      type: object
      properties:
        productId: { type: string }
        quantity: { type: integer }
    Order:
      type: object
      required: [id]
      properties:
        id: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch ms }
        email: { type: string, format: email }
        amount: { type: number }
        status: { type: string, description: 'e.g. completed' }
        products:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
    CustomerEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params: { $ref: '#/components/schemas/Customer' }
    CustomerBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params:
              type: array
              items: { $ref: '#/components/schemas/Customer' }
    CustomerTagEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params:
              type: object
              required: [email, tags]
              properties:
                email: { type: string, format: email }
                tags:
                  type: array
                  items: { type: string }
    CategoryEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params: { $ref: '#/components/schemas/Category' }
    CategoryBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params:
              type: array
              items: { $ref: '#/components/schemas/Category' }
    ProductEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params: { $ref: '#/components/schemas/Product' }
    ProductBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    OrderEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params: { $ref: '#/components/schemas/Order' }
    OrderBatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            params:
              type: array
              items: { $ref: '#/components/schemas/Order' }
