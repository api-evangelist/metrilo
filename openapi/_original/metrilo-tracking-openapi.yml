info:
  title: Metrilo Tracking & CRM API
  version: v2
  description: >-
    Metrilo's server-side ingestion API for ecommerce analytics, CRM, and email
    marketing. Push customers, categories, products, and orders (single or
    batch) into a Metrilo project. All requests are POST with a JSON envelope of
    `{ time, token, params }`. Every backend endpoint except `/customer`
    requires an `X-Digest` header containing an HMAC-SHA256 of the raw request
    body keyed with the project's API Secret.
  contact:
    name: Metrilo
    url: https://github.com/Metrilo/custom-integration
  x-brevo: Metrilo is part of Brevo (acquired 2021).
servers:
  - url: https://trk.mtrl.me/v2
    description: Metrilo tracking ingestion (production)
tags:
  - name: Customers
  - name: Categories
  - name: Products
  - name: Orders
paths:
  /customer:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create or update a single customer
      description: >-
        Create or update one customer, identified by email. This is the only
        backend endpoint that does NOT require the X-Digest header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /customer/batch:
    post:
      tags: [Customers]
      operationId: batchCustomers
      summary: Bulk import customers
      security: [{ xDigest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBatchEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /customer/tag:
    post:
      tags: [Customers]
      operationId: tagCustomer
      summary: Add tags to a customer
      security: [{ xDigest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerTagEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /customer/untag:
    post:
      tags: [Customers]
      operationId: untagCustomer
      summary: Remove tags from a customer
      security: [{ xDigest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerTagEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /category:
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create or update a single category
      security: [{ xDigest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /category/batch:
    post:
      tags: [Categories]
      operationId: batchCategories
      summary: Bulk import categories
      security: [{ xDigest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryBatchEnvelope'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /product:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create or update a single product
      security: [{ xDigest: [] }]
      requestBody:
