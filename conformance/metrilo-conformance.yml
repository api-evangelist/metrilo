standards:
  - id: gdpr
    conforms: true
    evidence: Published GDPR compliance docs, DPO named, DPA available, data-encryption article.
    docs: https://docs.metrilo.com/en/articles/1613060-metrilo-and-gdpr
  - id: hmac-request-signing
    conforms: true
    evidence: X-Digest header carries an HMAC-SHA256 of the request body keyed with the API Secret.
  - id: oauth2
    conforms: false
    evidence: No OAuth surface; project token + HMAC only.
  - id: rfc9457-problem-details
    conforms: false
    evidence: Errors are bare HTTP status codes; no application/problem+json documented.
  - id: openapi
    conforms: true
    version: 3.0.1
    evidence: >-
      Metrilo publishes its own OpenAPI 3.0.1 specification, "Metrilo tracking
      API" v2.1.1, 10 operations, 19 schemas, contact support@metrilo.com,
      servers https://trk.mtrl.me. Hosted on Metrilo's SwaggerHub org and
      mirrored byte-identically in the custom-integration repo. Saved verbatim
      to openapi/metrilo-tracking-api-openapi.yml.
    docs: https://app.swaggerhub.com/apis/metrilo/api/2.1.1
    caveats:
      - The specification declares NO securitySchemes even though every call requires an API token and (except POST /customer) an HMAC X-Digest header. The header parameter was declared in 2.0.0/2.0.1 and removed in 2.1.1.
      - servers[] omits the required /v2 path prefix.
      - Operations carry descriptions and operationIds but no summaries, and there are no request/response examples.
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      No first-party security.txt on any Metrilo host. docs.metrilo.com serves
      one, but it is Intercom's (Canonical app.intercom.com). See
      well-known/metrilo-well-known.yml.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No Sunset/Deprecation header support and no deprecation policy; see lifecycle/metrilo-lifecycle.yml.
  - id: asyncapi
    conforms: false
    applicable: false
    evidence: >-
      Metrilo has no event, streaming or webhook surface at all — the API is
      one-way ingestion only, and the docs, the GitHub org and the spec contain
      no callback, webhook or subscription concept. Not a gap: there is nothing
      to describe.
  - id: a2a-agent-card
    conforms: false
    evidence: >-
      /.well-known/agent-card.json and /.well-known/agent.json probed on all
      four hosts on 2026-08-13. No agent card. The 200s from www.metrilo.com are
      an SPA catch-all returning marketing HTML.
