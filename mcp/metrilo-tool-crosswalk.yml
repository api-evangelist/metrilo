input_schemas:
  authoritative_source: openapi/metrilo-tracking-api-openapi.yml
  envelope: '{ time: <epoch ms>, token: <API Token>, params: <object|array> }'
  note: >-
    Every operation takes the same three-field envelope; the tool's real input
    contract is the requestBody schema of its bound operation
    (components.schemas.*OperationObject in the provider spec).
  transport_caveat: >-
    The provider spec declares servers[] as https://trk.mtrl.me with NO /v2
    prefix, while every published curl example and the apis.yml baseURL use
    https://trk.mtrl.me/v2. Use /v2. Captured in
    overlays/metrilo-tracking-api-overlay.yaml rather than by editing the
    verbatim spec.
