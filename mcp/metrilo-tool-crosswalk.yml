note: >-
  Metrilo ships no MCP server; mcp/metrilo-mcp.yml is an API Evangelist
  CANDIDATE tool list (deployment.mode: none). This crosswalk therefore binds
  candidate tools to real operations rather than recording a live agent surface.
  Its value is that Metrilo publishes TWO operationId vocabularies for the same
  ten operations — its own OpenAPI 3.0.1 (metrilo_open_api_specification.yml,
  ids like `customerOperation`) and the API Evangelist refinement (ids like
  `createCustomer`) — so every row carries both. The PROVIDER ids are
  authoritative for anyone calling the API; the AE ids are what the repo's
  skills/ and arazzo/ artifacts reference.
