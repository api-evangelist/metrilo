client_only:
  - surface: window.metrilo
    reason: >-
      Browser-side tracking functions with no server-side REST equivalent —
      viewPage, viewArticle, viewCategory, viewProduct, search, addToCart,
      removeFromCart, checkout, customEvent, integrateForm. Behavioural events
      can only be produced from a page, so an agent cannot emit them through
      the ingestion API. This is a genuine surface divergence, not a gap.
    functions: 10
  - surface: window.metrilo (overlapping)
    reason: >-
      identify, customerDetails and applyTags overlap semantically with
      createCustomer / tagCustomer but operate on the anonymous cbuid session
      rather than on the server-side record.
    functions: 3
